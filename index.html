<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆再生メーカー | Audio Reverse Player</title>
<meta name="description" content="音声ファイルをブラウザ上で逆再生に変換・再生・ダウンロードできるアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔁</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1><span class="emoji" aria-hidden="true">🔁</span> 逆再生メーカー</h1>
      <p class="subtitle">音声ファイルをアップロードして、その場で逆再生に変換・再生・ダウンロード。すべてブラウザ内で処理され、サーバーには送信されません。</p>
    </header>

    <main>
      <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="音声ファイルを選択またはドロップ">
        <input type="file" id="fileInput" accept="audio/*" hidden>
        <div class="dropzone-inner">
          <div class="dropzone-icon" aria-hidden="true">🎵</div>
          <p class="dropzone-text">ここに音声ファイルをドロップ<br class="mobile-hide">またはクリックして選択</p>
          <p class="dropzone-hint">MP3 / WAV / OGG / M4A など</p>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <section id="workspace" class="workspace hidden">
        <div class="file-info">
          <span id="fileName" class="file-name"></span>
          <span id="fileMeta" class="file-meta"></span>
        </div>

        <div class="waveforms">
          <div class="waveform-block">
            <h2>元の音声</h2>
            <canvas id="waveOriginal" width="800" height="120"></canvas>
            <div class="controls">
              <button id="playOriginal" class="btn" type="button">▶ 再生</button>
              <button id="stopOriginal" class="btn btn-ghost" type="button">■ 停止</button>
            </div>
          </div>

          <div class="waveform-block">
            <h2>逆再生音声</h2>
            <canvas id="waveReversed" width="800" height="120"></canvas>
            <div class="controls">
              <button id="playReversed" class="btn btn-primary" type="button">▶ 再生</button>
              <button id="stopReversed" class="btn btn-ghost" type="button">■ 停止</button>
              <button id="downloadReversed" class="btn btn-accent" type="button">⬇ WAVでダウンロード</button>
            </div>
          </div>
        </div>

        <div class="another">
          <button id="reset" class="btn btn-ghost" type="button">別のファイルを選ぶ</button>
        </div>
      </section>
    </main>

    <footer>
      <p>すべての処理はブラウザ内（Web Audio API）で完結します。ファイルはアップロードされません。</p>
      <p><a href="https://github.com/" id="repoLink" target="_blank" rel="noopener">GitHubで見る</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
